name: Import Daily Box Scores

on:
  schedule:
    # Run daily at 1:45 AM UTC (8:45 PM EST previous day / 9:45 PM EST previous day with DST)
    - cron: '45 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  import-boxscores:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install nba-api supabase pandas python-dotenv
      
      - name: Import box scores for yesterday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python3 scripts/setup/import_daily_boxscores.py
      
      - name: Report results
        if: always()
        run: |
          echo "✅ Box score import completed at $(date)"

