<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>HoopGeek - Fantasy Basketball</title>
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:site_name" content="HoopGeek" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HoopGeek - Fantasy Basketball" />
    <meta property="og:description" content="Join daily fantasy basketball contests and compete for prizes. Build your lineup, track live scores, and dominate the leaderboard!" />
    <meta property="og:image" content="https://hoopgeek.app/og-image.jpg" />
    <meta property="og:url" content="https://hoopgeek.app" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HoopGeek - Fantasy Basketball" />
    <meta name="twitter:description" content="Join daily fantasy basketball contests and compete for prizes. Build your lineup, track live scores, and dominate the leaderboard!" />
    <meta name="twitter:image" content="https://hoopgeek.app/og-image.jpg" />
    
    <!-- Additional Meta Tags -->
    <meta name="description" content="Join daily fantasy basketball contests and compete for prizes. Build your lineup, track live scores, and dominate the leaderboard!" />
    <meta name="keywords" content="fantasy basketball, NBA, daily fantasy sports, DFS, basketball contests" />
  </head>
  <body>
    <script>
      // Force dark mode by clearing any stored light mode preference
      try {
        localStorage.removeItem('mui-mode');
        localStorage.setItem('hoopgeek-mode', 'dark');
      } catch (e) {
        console.log('Could not access localStorage');
      }
      
      // Hide mobile browser URL bar
      (function() {
        // Check if mobile device
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          // Function to hide URL bar
          function hideURLBar() {
            // Small delay to ensure page is rendered
            setTimeout(function() {
              // Scroll down 1px to hide address bar
              window.scrollTo(0, 1);
              // Then scroll back to top (address bar stays hidden)
              setTimeout(function() {
                window.scrollTo(0, 0);
              }, 10);
            }, 100);
          }
          
          // Hide URL bar on load
          if (document.readyState === 'complete') {
            hideURLBar();
          } else {
            window.addEventListener('load', hideURLBar);
          }
          
          // Hide URL bar on orientation change
          window.addEventListener('orientationchange', function() {
            setTimeout(hideURLBar, 200);
          });
          
          // Hide URL bar when page becomes visible (from background)
          document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
              hideURLBar();
            }
          });
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
